# PrivOS Parser, self-hosted: job API + worker, Redis and MongoDB.
#
# The parser reads uploads from PrivOS Hub, calls the vision API you configure
# in .env, and writes the Markdown into the Hub's S3-compatible bucket. Copy
# env.parser.template to .env, fill it in, then:  docker compose up -d
# The full guide is docs/parser/README.md in the PrivOS-AI/privos repository.
# Run it from its own directory, not from the Hub's /opt/privos.

name: ${COMPOSE_PROJECT_NAME:-privos-parser}

services:
  parser:
    image: ghcr.io/privos-ai/privos-parser:v1.0.0@sha256:__PARSER_DIGEST__
    container_name: ${PARSER_CONTAINER_NAME:-privos-parser}
    restart: unless-stopped
    # The worker finishes the page it is reading before it exits; this must stay
    # above WORKER_SHUTDOWN_TIMEOUT_SECONDS plus the API drain.
    stop_grace_period: 720s
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      PARSER_STANDALONE: "true"
      # The one key PrivOS Hub sends as "Authorization: Bearer <key>".
      OCR_JOB_API_KEY: ${PARSER_API_KEY:?set PARSER_API_KEY in .env (openssl rand -hex 32)}
      # Vision API: any OpenAI-compatible server that accepts images.
      VISION_API_BASE_URL: ${VISION_API_BASE_URL:?set VISION_API_BASE_URL in .env}
      VISION_API_MODEL: ${VISION_API_MODEL:?set VISION_API_MODEL in .env}
      PARSER_INFERENCE_SERVICE_API_KEY: ${VISION_API_KEY:-}
      VISION_API_MAX_CONCURRENCY: ${VISION_API_MAX_CONCURRENCY:-4}
      VISION_API_MAX_TOKENS: ${VISION_API_MAX_TOKENS:-8192}
      VISION_API_TIMEOUT_SECONDS: ${VISION_API_TIMEOUT_SECONDS:-300}
      VISION_API_EXTRA_BODY: ${VISION_API_EXTRA_BODY:-{}}
      # Storage: the Hub's bucket, with the Hub's scoped access key.
      RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:?set RUSTFS_ENDPOINT in .env}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-privos}
      RUSTFS_SECURE: ${RUSTFS_SECURE:-false}
      # State services in this stack.
      REDIS_HOST: redis
      MONGO_URI: mongodb://parser:${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}@mongo:27017/?authSource=admin
      # Sizing. Raise WORKER_CONCURRENCY only together with PARSER_MEM.
      WORKER_CONCURRENCY: ${PARSER_WORKER_CONCURRENCY:-2}
      WORKER_SHUTDOWN_TIMEOUT_SECONDS: "600"
      RELOAD: "false"
    # Lets VISION_API_BASE_URL point at a model server on this host through
    # host.docker.internal.
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${PARSER_BIND_ADDRESS:-127.0.0.1}:${PARSER_PORT:-8000}:8000"
    volumes:
      - parser_temp:/app/temp
    mem_limit: ${PARSER_MEM:-3g}
    cpus: ${PARSER_CPUS:-2}
    security_opt: ["no-new-privileges:true"]

  redis:
    image: redis:7.2-alpine@sha256:__REDIS_DIGEST__
    restart: unless-stopped
    # The parser refuses to start unless Redis keeps its data durably:
    # append-only with fsync on every write, no eviction.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - always
      - --no-appendfsync-on-rewrite
      - "no"
      - --aof-load-truncated
      - "no"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 256m
    security_opt: ["no-new-privileges:true"]

  mongo:
    image: mongo:7.0.14@sha256:__MONGO_DIGEST__
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: parser
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ping:1})\" -u parser -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin"]
      interval: 10s
      timeout: 8s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]

volumes:
  parser_temp:
  redis_data:
  mongo_data:
