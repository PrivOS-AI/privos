# PrivOS self-hosted bundle — CI.
#
# This repository IS the published bundle: install.sh, compose.yml,
# env.template, rustfs-init.sh and the rest live at the repo ROOT (exactly
# what a self-hoster downloads from a GitHub Release), so every path below is
# repo-root relative. This repository is the only copy of the bundle — edit
# here, never in a downstream checkout.
name: self-hosted-bundle-ci

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
          shellcheck -e SC2317 -x *.sh tests/*.sh

  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install minisign + jq
        run: sudo apt-get update -y && sudo apt-get install -y minisign jq
      - name: Generate a throwaway DEV signing key (fixture for verify tests)
        run: |
          mkdir -p .secrets
          minisign -G -W -f \
            -p .secrets/dev-minisign.pub \
            -s .secrets/dev-minisign.key
      - name: Run bash unit tests
        run: bash tests/run-tests.sh

  compose-config:
    runs-on: ubuntu-24.04
    needs: [shellcheck]
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config (no pull, no build)
        run: |
          cp env.template ci-dummy.env
          {
            echo "PRIVOS_DIR=/opt/privos"
            echo "PRIVOS_STACK_VERSION=ci-dummy"
            echo "PRIVOS_ROOT_URL=http://localhost:3000"
            echo "PRIVOS_DEPLOYMENT_ID=00000000-0000-4000-8000-000000000000"
            echo "MONGO_ROOT_USER=privos"
            echo "MONGO_ROOT_PASSWORD=dummy"
            echo "MONGO_URL=mongodb://privos:dummy@mongo:27017/privos?replicaSet=rs0&authSource=admin&w=1"
            echo "MONGO_OPLOG_URL=mongodb://privos:dummy@mongo:27017/local?replicaSet=rs0&authSource=admin&w=1"
            echo "MONGODB_URL=mongodb://privos:dummy@mongo:27017/?replicaSet=rs0&authSource=admin&w=1"
            echo "RUSTFS_ROOT_USER=privos-root"
            echo "RUSTFS_ROOT_PASSWORD=dummy"
            echo "RUSTFS_ACCESS_KEY=dummy"
            echo "RUSTFS_SECRET_KEY=dummy"
            echo "ADMIN_PASS=dummy"
            echo "ADMIN_EMAIL=admin@localhost"
            echo "REG_TOKEN=dummy"
            echo "VAPID_SUBJECT=mailto:admin@localhost"
            echo "VAPID_PUBLIC_KEY=dummy"
            echo "VAPID_PRIVATE_KEY=dummy"
            echo "SANDBOX_API_KEY=dummy"
            echo "PRIVOS_DOCKER_SOCKET_GID=999"
            echo "PRIVOS_APP_CLUSTER_BOOTSTRAP_TOKEN=dummy"
            echo "PRIVOS_SECRET_STORE_KEY=dummy"
          } >> ci-dummy.env
          docker compose -f compose.yml --env-file ci-dummy.env config >/dev/null
          docker compose -f compose.yml --env-file ci-dummy.env --profile knowledge-vector --profile app-cluster config >/dev/null
          rm -f ci-dummy.env

  # Digest-pinned images are not resolvable until publish-self-hosted-bundle.sh
  # has run for real (this task never does — see SIGNING.md
  # and RENDERER-DIFF.md). A DinD smoke test that actually starts the stack
  # therefore no-ops here: it only runs once every image in versions.json
  # carries a real (non-placeholder) digest, which `publish-self-hosted-
  # bundle.sh --check` verifies.
  dind-smoke:
    runs-on: ubuntu-24.04
    needs: [compose-config]
    steps:
      - uses: actions/checkout@v4
      - name: Skip unless every image digest is resolved
        id: gate
        run: |
          if grep -q '__[A-Z_]*_DIGEST__' compose.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Unresolved digest placeholders — bundle has not been published yet, skipping the live smoke test."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: docker compose up (public images only)
        if: steps.gate.outputs.run == 'true'
        run: |
          # A real run resolves PRIVOS_DOCKER_SOCKET_GID, generates secrets,
          # etc. the way install.sh does — left as a follow-up once G3 (ghcr
          # packages public) is green and a real bundle has been published.
          echo "TODO: exercise install.sh end-to-end once G2/G3 (see docs/self-hosted-install.md) are live."
