# Overlay for the usual Community Edition layout: PrivOS Hub and the parser run
# on the same Docker host. It attaches the parser to the Hub's network so that
#   - the Hub reaches the parser at http://privos-parser:8000, and
#   - the parser reaches the Hub's RustFS at privos-rustfs:9000.
# Drop this file from COMPOSE_FILE in .env when the Hub runs on another host.

services:
  parser:
    networks: [default, privos]

networks:
  privos:
    name: ${PRIVOS_NETWORK:-privos-sandbox-net}
    external: true
