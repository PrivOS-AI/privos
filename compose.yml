# PrivOS self-hosted bundle — derived from privos-portal's fleet renderer
# (render-tenant-stack.ts / render-compose-file.ts). See RENDERER-DIFF.md for
# the exact service-by-service diff against the multi-tenant fleet.
#
# This file is a PUBLISHED, SIGNED artifact (minisign, see SIGNING.md). Image
# references below carry `__..._DIGEST__` placeholders that
# publish-self-hosted-bundle.sh replaces with real `sha256:` digests before
# signing — do not hand-edit a placeholder and expect it to pull.
#
# install.sh writes the companion `.env` (secrets + knobs, mode 0600) into the
# same directory before running `docker compose --env-file .env -f compose.yml
# ... up -d`. Every host path below is anchored on the absolute ${PRIVOS_DIR}
# install.sh resolves (default /opt/privos) so bind mounts stay correct
# regardless of the working directory a later `docker compose` invocation runs
# from — this matters because the sandbox-proxy spawns agent VM containers
# directly via the Docker API (not through compose) and must bind-mount host
# paths that are valid on the real host filesystem, not merely inside its own
# container namespace.

name: privos-self-hosted

networks:
  privos:
    name: ${PRIVOS_NETWORK:-privos-sandbox-net}
    external: true

# Hub instance identity (P-256 keypair) + the self-hosted license-request code
# and activation status live under /var/lib/privos. A host bind (not a named
# volume) so install.sh can chown it to the hub's uid (1001) — a fresh named
# volume is root-owned, and the hub (uid 1001) then cannot mkdir there, which
# silently fails the license-request-code + status bootstrap (EACCES). Under
# ${PRIVOS_DIR}/data it still survives --uninstall (only --purge removes it).

services:
  mongo:
    image: mongo:7.0.14@sha256:__MONGO_DIGEST__
    container_name: ${PRIVOS_PROJECT:-privos}-mongo
    restart: unless-stopped
    networks: [privos]
    command: ["--replSet", "rs0", "--keyFile", "/run/secrets/mongo-keyfile", "--wiredTigerCacheSizeGB", "${PRIVOS_MONGO_CACHE_GB:-1}"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    volumes:
      - ${PRIVOS_DIR:?PRIVOS_DIR is required}/data/mongo:/data/db
      - ${PRIVOS_DIR}/secrets/mongo-keyfile:/run/secrets/mongo-keyfile:ro
    mem_limit: ${PRIVOS_MONGO_MEM:-1g}
    cpus: ${PRIVOS_MONGO_CPUS:-2}
    # WiredTiger holds one OS file per collection+index. Rocket.Chat's bootstrap
    # creates hundreds on first start, blowing past a host whose dockerd default
    # nofile is 1024 (fresh Ubuntu): open() returns EMFILE (errno 24) mid
    # __wt_block_manager_create -> WT_PANIC -> fassert abort. Pin the mongod
    # recommended limit so the container never inherits a low host default.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --host $$(hostname -i) --quiet --eval \"db.adminCommand({ping:1})\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.2-alpine@sha256:__REDIS_DIGEST__
    container_name: ${PRIVOS_PROJECT:-privos}-redis
    restart: unless-stopped
    networks: [privos]
    mem_limit: ${PRIVOS_REDIS_MEM:-256m}
    cpus: ${PRIVOS_REDIS_CPUS:-0.5}
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  rustfs:
    image: ghcr.io/rustfs/rustfs:1.0.0-rc.6@sha256:8d8bfa61f3a20cdcf644562bb8c3a314ca03c66a9827f6056f741e787bf0c804  # linux/amd64 child digest resolved on ctl-01 (D6)
    container_name: ${PRIVOS_PROJECT:-privos}-rustfs
    restart: unless-stopped
    networks: [privos]
    user: "10001:10001"
    environment:
      # RustFS-owned env names (D9, never mapped) — our own RUSTFS_ROOT_USER/
      # PASSWORD (env.template) are mapped into them here so a missing value
      # fails closed instead of booting the sample admin identity.
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_USER:?RUSTFS_ROOT_USER is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:?RUSTFS_ROOT_PASSWORD is required}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_VOLUMES: /data
      # The bundle never publishes a console.
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_HEALTH_ENDPOINT_ENABLE: "true"
      # No OTLP collector here; keep an audit trail on stdout instead.
      RUSTFS_OBS_LOG_STDOUT_ENABLED: "true"
      RUSTFS_OBS_TRACES_EXPORT_ENABLED: "false"
      RUSTFS_OBS_METRICS_EXPORT_ENABLED: "false"
      RUSTFS_OBS_LOGS_EXPORT_ENABLED: "false"
      RUSTFS_OBS_PROFILING_EXPORT_ENABLED: "false"
    volumes:
      - ${PRIVOS_DIR}/data/rustfs:/data
    # API only — loopback. RustFS ships no console on this port; nothing else
    # to publish.
    ports:
      - "127.0.0.1:${PRIVOS_RUSTFS_PORT:-9000}:9000"
    mem_limit: ${PRIVOS_RUSTFS_MEM:-512m}
    cpus: ${PRIVOS_RUSTFS_CPUS:-1}
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # /minio/health/live is a liveness probe that answers 200 even when
      # storage is not usable; /health/ready reflects storage + IAM readiness.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # One-shot: mirrors rustfs-provisioner.ts (rc bucket create, versioning, scoped
  # service account). Exits 0 on success; install.sh runs it explicitly via
  # `docker compose run --rm rustfs-init` after rustfs is healthy, then
  # `docker compose up -d` brings it up again as a no-op on every re-run
  # (idempotent — see rustfs-init.sh).
  rustfs-init:
    image: docker.io/rustfs/rc:v0.1.35@sha256:6558b9777a1e75fc92e040a7bae67af93334703b4b4ab3a28cf45ecc08ee2404  # linux/amd64 child digest resolved on ctl-01 (D6)
    container_name: ${PRIVOS_PROJECT:-privos}-rustfs-init
    networks: [privos]
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_ROOT_USER:?RUSTFS_ROOT_USER is required}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_ROOT_PASSWORD:?RUSTFS_ROOT_PASSWORD is required}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-privos}
      RC_CONFIG_DIR: /tmp/rc
    volumes:
      - ${PRIVOS_DIR}/rustfs-init.sh:/rustfs-init.sh:ro
    entrypoint: ["/bin/sh", "/rustfs-init.sh"]
    security_opt: ["no-new-privileges:true"]

  hub:
    image: ghcr.io/privos-ai/privos-hub:${PRIVOS_STACK_VERSION:?PRIVOS_STACK_VERSION is required}@sha256:__HUB_DIGEST__
    container_name: ${PRIVOS_PROJECT:-privos}-hub
    restart: unless-stopped
    networks: [privos]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      ROOT_URL: ${PRIVOS_ROOT_URL:?PRIVOS_ROOT_URL is required}
      PRIVOS_INTERNAL_URL: http://hub:3000
      DEPLOYMENT_ID: ${PRIVOS_DEPLOYMENT_ID:?PRIVOS_DEPLOYMENT_ID is required}
      PORT: "3000"
      NODE_ENV: production
      REDIS_URL: redis://redis:6379/0
      EXIT_UNHANDLEDPROMISEREJECTION: "1"
      MONGO_URL: ${MONGO_URL:?MONGO_URL is required}
      MONGO_OPLOG_URL: ${MONGO_OPLOG_URL:?MONGO_OPLOG_URL is required}
      ADMIN_USERNAME: admin
      ADMIN_NAME: Administrator
      ADMIN_PASS: ${ADMIN_PASS:?ADMIN_PASS is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      REG_TOKEN: ${REG_TOKEN:?REG_TOKEN is required}
      # encrypted_secrets vault key (encrypted-secret-store.ts) — without it
      # the hub falls back to a plaintext secret store and refuses to pair
      # an App Cluster (an RCE-grade credential is never written in the
      # clear). Always generated by install.sh, independent of whether the
      # app-cluster profile is enabled.
      PRIVOS_SECRET_STORE_KEY: ${PRIVOS_SECRET_STORE_KEY:?PRIVOS_SECRET_STORE_KEY is required}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?VAPID_SUBJECT is required}
      OVERWRITE_SETTING_WebPush_public_key: ${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY is required}
      OVERWRITE_SETTING_WebPush_private_key: ${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY is required}
      SERVICE_USAGE_AUTHORIZATION_FAIL_CLOSED: ${SERVICE_USAGE_AUTHORIZATION_FAIL_CLOSED:-true}
      Accounts_AvatarStorePath: /app/bundle/uploads
      # Self-hosted signal — fleet derives this from Workspace.selfHosted; a
      # self-hosted hub has no portal Workspace row to read it from.
      PRIVOS_SELF_HOSTED: "true"
      # Community bootstrap pairing is a mutual HMAC challenge, so the SAME seed
      # has to reach both ends — the App Cluster below gets it too. Without it
      # here the hub answers `not_configured` to every attempt and the bundled
      # App Cluster never pairs, while its healthcheck still reports healthy.
      # Only meaningful under the app-cluster profile; harmless otherwise.
      PRIVOS_APP_CLUSTER_BOOTSTRAP_TOKEN: ${PRIVOS_APP_CLUSTER_BOOTSTRAP_TOKEN:?PRIVOS_APP_CLUSTER_BOOTSTRAP_TOKEN is required}
      # See RENDERER-DIFF.md: these four live on board/proxy on the fleet;
      # the hub also needs them here for BYO-vs-credit LLM routing and
      # self-hosted license polling (phase 2/5).
      PRIVOS_SANDBOX_MODE: "true"
      SANDBOX_PROXY_URL: http://sandbox-proxy:8557
      SANDBOX_APP_ORIGIN: http://sandbox-board:8556
      AGENT_PROVIDER: privos-agent-sdk
      # BYO LLM key (Community self-hosted, no license). A paid+licensed hub
      # receives a LiteLLM key over its poll response instead — the installer
      # never touches that path.
      Cloud_Self_Hosted_LLM_Provider: ${PRIVOS_LLM_PROVIDER:-byo}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # --- knowledge-vector profile (off by default) ---
      WEAVIATE_URL: ${PRIVOS_WEAVIATE_URL:-http://weaviate:8080}
      WEAVIATE_COLLECTION: KnowledgeObject
      KNOWLEDGE_WORKSPACE_ID: ${PRIVOS_DEPLOYMENT_ID:-}
      WEAVIATE_API_KEY: ${WEAVIATE_ROOT_KEY:-}
      # --- App Cluster (community marketplace runtime, app-cluster profile) ---
      # Live whenever the app-cluster service is enabled (the default) — both
      # are what phase 7 makes load-bearing: MCP_APP_LOCAL_RUNTIME_V3 gates
      # the v3 SELF_HOSTED_LOCAL runtime path, and the endpoint hostname
      # allowlist must match the fixed `*.app-cluster.internal` suffix the
      # hub's runtime-endpoint validator grants App Cluster endpoints under.
      MCP_APP_LOCAL_RUNTIME_V3: "true"
      MCP_LOCAL_RUNTIME_ENDPOINT_HOSTS: "*.app-cluster.internal"
      # The hub still stages marketplace artifacts locally before handing
      # them to the App Cluster over the tunnel (D9).
      MARKETPLACE_LOCAL_APP_DIR: /var/lib/privos/marketplace/apps
      # RustFS-hosted app UI assets (phase 8) — the kill switch is
      # `enabledUnlessDisabled`, so only an explicit "false" turns it off.
      MCP_APP_UI_RUSTFS: ${PRIVOS_MCP_APP_UI_RUSTFS:-true}
      # --- Hub -> RustFS wiring -------------------------------------------
      # rustfs-init provisions the bucket, policy and access key, and compose
      # hands RUSTFS_* to board/proxy — but the hub was given none of it, and it
      # reads this config from SETTINGS (buildRustfsConfigFromSettings), not env.
      # Every one of them was empty, so uploading any file returned
      # "RustFS is not configured. Please configure RustFS settings in the admin
      # panel." — i.e. file upload was dead on arrival on every self-hosted
      # install. Seeded through the same OVERWRITE_SETTING_ mechanism the
      # WebPush keys above already use.
      OVERWRITE_SETTING_FileUpload_S3_Bucket: ${RUSTFS_BUCKET:-privos}
      OVERWRITE_SETTING_FileUpload_S3_AWSAccessKeyId: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      OVERWRITE_SETTING_FileUpload_S3_AWSSecretAccessKey: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      # The host baked into every presigned URL, signed via
      # X-Amz-SignedHeaders=host so clients cannot rewrite it. `rustfs` is the
      # compose-network name, reachable by every service on this network (hub,
      # app-cluster, board, proxy). RustFS itself stays published on
      # 127.0.0.1 only — an object store on a single-host install has no
      # business being internet-facing. NOTE: sandbox VMs are spawned with
      # host-port publishing and are NOT on this network (see VM_NETWORK below),
      # so presigned URLs still do not reach them; that needs either VM_NETWORK
      # attachment or a host-reachable RustFS bind, and is deliberately left as a
      # separate decision rather than guessed at here.
      OVERWRITE_SETTING_FileUpload_S3_BucketURL: ${RUSTFS_PUBLIC_URL:-http://rustfs:9000}
      # --- Hub -> sandbox wiring -----------------------------------------
      # SANDBOX_PROXY_URL above is already correct, but the hub only consults it
      # when this is true; it defaults to false, so admin showed "no global
      # sandbox configured" while the proxy sat there running.
      OVERWRITE_SETTING_PrivOSSandbox_Use_Env: "true"
      # File publisher (published-files renderer). Empty (default) hides the
      # public publish link in the hub UI. Set it to the publisher's OWN
      # hostname — never the hub host: the publisher renders arbitrary uploaded
      # HTML in a sandboxed origin, and co-hosting it with the hub would defeat
      # that isolation. install.sh preflight refuses a URL on the ROOT_URL host.
      PRIVOS_PUBLISHER_URL: ${PRIVOS_PUBLISHER_URL:-}
    volumes:
      - ${PRIVOS_DIR}/data/hub-lib:/var/lib/privos
      - ${PRIVOS_DIR}/data/hub-uploads:/app/bundle/uploads
      # Marketplace app artifacts: a host bind (as on the fleet), kept as the
      # hub's local staging area for MARKETPLACE_LOCAL_APP_DIR (D9) — the App
      # Cluster never mounts this; it receives artifacts streamed over the
      # dial-out tunnel (phase 6), not a shared volume.
      - ${PRIVOS_DIR}/data/hub-marketplace:/var/lib/privos/marketplace
    # Only the hub is published, and only the hub is published on all
    # interfaces — everything else in this file binds 127.0.0.1 or is not
    # published at all.
    ports:
      - "0.0.0.0:${PRIVOS_HUB_PORT:-3000}:3000"
    mem_limit: ${PRIVOS_HUB_MEM:-2g}
    cpus: ${PRIVOS_HUB_CPUS:-2}
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/info"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 480s

  # File publisher (published-files renderer, SINGLE mode: fronts this one hub).
  # Binds loopback by default (PRIVOS_PUBLISHER_BIND) — front it with your own
  # reverse proxy + TLS on a DEDICATED hostname, never the hub's own host (the
  # publisher renders uploaded HTML in a sandboxed origin; sharing the hub origin
  # defeats that). Leaving PRIVOS_PUBLISHER_URL empty on the hub simply hides the
  # public link; this service is then idle and harmless.
  publisher:
    image: ghcr.io/privos-ai/privos-publisher:${PRIVOS_STACK_VERSION:?PRIVOS_STACK_VERSION is required}@sha256:__PUBLISHER_DIGEST__
    container_name: ${PRIVOS_PROJECT:-privos}-publisher
    restart: unless-stopped
    networks: [privos]
    depends_on:
      hub:
        condition: service_healthy
    environment:
      PUBLISHER_MODE: single
      PRIVOS_HUB_API_URL: http://hub:3000/api/v1
      HOSTNAME: 0.0.0.0
      PORT: "5000"
    ports:
      - "${PRIVOS_PUBLISHER_BIND:-127.0.0.1}:${PRIVOS_PUBLISHER_PORT:-8558}:5000"
    mem_limit: ${PRIVOS_PUBLISHER_MEM:-256m}
    cpus: ${PRIVOS_PUBLISHER_CPUS:-0.5}
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  sandbox-board:
    image: ghcr.io/privos-ai/privos-sandbox-board:${PRIVOS_STACK_VERSION:?PRIVOS_STACK_VERSION is required}@sha256:__SANDBOX_BOARD_DIGEST__
    container_name: ${PRIVOS_PROJECT:-privos}-sandbox-board
    restart: unless-stopped
    networks: [privos]
    user: "1001:1001"
    depends_on:
      mongo:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      DB_DIALECT: mongo
      MONGODB_URL: ${MONGODB_URL:?MONGODB_URL is required}
      NODE_ENV: production
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      PRIVOS_SANDBOX_MODE: "true"
      AGENT_PROVIDER: privos-agent-sdk
      ROXANE_PROXIED_BASE_URL: ${PRIVOS_LLM_BASE_URL:-}
      ROXANE_MODEL: gauga
      ROXANE_DEFAULT_GAUGA_MODEL: gauga
      ROXANE_DEFAULT_ISSUS_MODEL: issus
      ROXANE_DEFAULT_GRANIC_MODEL: granic
      PORT: "8556"
      SANDBOX_APP_ORIGIN: http://sandbox-board:8556
      SANDBOX_PROXY_URL: http://sandbox-proxy:8557
      BOT_INTERNAL_API_BASE_URL: http://sandbox-board:8556
      API_ACCESS_KEY: ${SANDBOX_API_KEY:?SANDBOX_API_KEY is required}
      POOL_DATA_BASE: ${PRIVOS_DIR}/data/sandbox-pool
    volumes:
      - ${PRIVOS_DIR}/data/sandbox-board:/app/data
      - ${PRIVOS_DIR}/data/sandbox-pool:${PRIVOS_DIR}/data/sandbox-pool
    # Loopback only — reachable from the host (installer health check,
    # operator debugging), never from the network.
    ports:
      - "127.0.0.1:${PRIVOS_BOARD_PORT:-8556}:8556"
    mem_limit: ${PRIVOS_BOARD_MEM:-512m}
    cpus: ${PRIVOS_BOARD_CPUS:-1}
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8556/api/bot/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  sandbox-proxy:
    image: ghcr.io/privos-ai/privos-sandbox-proxy:${PRIVOS_STACK_VERSION:?PRIVOS_STACK_VERSION is required}@sha256:__SANDBOX_PROXY_DIGEST__
    container_name: ${PRIVOS_PROJECT:-privos}-sandbox-proxy
    restart: unless-stopped
    networks: [privos]
    # Root, like the fleet: the proxy spawns per-bot agent VM containers via
    # the Docker API (docker.sock bind below) — root-equivalent on this host.
    # ACCEPTED RISK, same as the fleet's compose-ssh-driver comment; contained
    # by loopback-only exposure + the DOCKER-USER rules docker-user-rules.sh
    # installs.
    user: "0:0"
    depends_on:
      mongo:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    environment:
      DB_DIALECT: mongo
      MONGODB_URL: ${MONGODB_URL:?MONGODB_URL is required}
      NODE_ENV: production
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      PRIVOS_SANDBOX_MODE: "true"
      AGENT_PROVIDER: privos-agent-sdk
      ROXANE_PROXIED_BASE_URL: ${PRIVOS_LLM_BASE_URL:-}
      ROXANE_MODEL: gauga
      ROXANE_DEFAULT_GAUGA_MODEL: gauga
      ROXANE_DEFAULT_ISSUS_MODEL: issus
      ROXANE_DEFAULT_GRANIC_MODEL: granic
      PORT: "8557"
      SANDBOX_PROXY_URL: http://sandbox-proxy:8557
      API_ACCESS_KEY: ${SANDBOX_API_KEY:?SANDBOX_API_KEY is required}
      POOL_DATA_BASE: ${PRIVOS_DIR}/data/sandbox-pool
      COLLOC_HUB_ID: ${PRIVOS_DEPLOYMENT_ID:?PRIVOS_DEPLOYMENT_ID is required}
      PRIVOS_COLLOCATION_ENABLED: "true"
      # Legacy host-port pool (VM_NETWORK left unset — see RENDERER-DIFF.md):
      # each spawned agent VM publishes its own host port from this range,
      # bound to POOL_BIND_HOST so the whole range stays loopback-only.
      POOL_PORT_RANGE: ${PRIVOS_VM_PORT_RANGE:-30000-30999}
      POOL_BIND_HOST: 127.0.0.1
      POOL_IMAGE: ghcr.io/privos-ai/privos-sandbox-vm:${PRIVOS_STACK_VERSION:?PRIVOS_STACK_VERSION is required}@sha256:__SANDBOX_VM_DIGEST__
      # --- knowledge-vector profile (off by default) ---
      KNOWLEDGE_VECTOR_PROXY_ENABLED: ${PRIVOS_WITH_KNOWLEDGE_VECTOR:-false}
      WEAVIATE_INTERNAL_URL: http://weaviate:8080
      WEAVIATE_ROOT_API_KEY: ${WEAVIATE_ROOT_KEY:-}
    volumes:
      - ${PRIVOS_DIR}/data/sandbox-proxy:/app/data
      - ${PRIVOS_DIR}/data/sandbox-pool:${PRIVOS_DIR}/data/sandbox-pool
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:${PRIVOS_PROXY_PORT:-8557}:8557"
    mem_limit: ${PRIVOS_PROXY_MEM:-512m}
    cpus: ${PRIVOS_PROXY_CPUS:-1}
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8557/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # --- knowledge-vector profile: opt-in, off by default -------------------
  # Managed knowledge base / semantic search. ~+2 GB RAM (raises the
  # practical minimum from 4 GB to 8 GB). Embedding routing
  # (OVERWRITE_SETTING_Knowledge_Embedding_*) depends on the llm.privos.io
  # gateway ingress, which is not yet published — left unset here rather than
  # guessed at; see docs/self-hosted-install.md.
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.38.2@sha256:__WEAVIATE_DIGEST__
    container_name: ${PRIVOS_PROJECT:-privos}-weaviate
    restart: unless-stopped
    profiles: ["knowledge-vector"]
    networks: [privos]
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      QUERY_DEFAULTS_LIMIT: "25"
      DEFAULT_VECTORIZER_MODULE: "none"
      API_BASED_MODULES_DISABLED: "true"
      AUTOSCHEMA_ENABLED: "false"
      DISABLE_TELEMETRY: "true"
      CLUSTER_HOSTNAME: privos-self-hosted-vector
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_USERS: workspace-vector-root
      # `docker compose` interpolates every service's env regardless of which
      # profiles are active (config resolution happens before profile
      # filtering) — a hard `:?` here would break a base install that never
      # enables knowledge-vector. install.sh's finalize_sidecar_config()
      # always populates this before compose ever runs with the profile on.
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_ROOT_KEY:-}
      AUTHORIZATION_ENABLE_RBAC: "true"
      AUTHORIZATION_RBAC_ROOT_USERS: workspace-vector-root
    volumes:
      - ${PRIVOS_DIR}/data/weaviate:/var/lib/weaviate
    mem_limit: ${PRIVOS_WEAVIATE_MEM:-2g}
    cpus: ${PRIVOS_WEAVIATE_CPUS:-1}
    security_opt: ["no-new-privileges:true"]
    read_only: true
    cap_drop: ["ALL"]
    pids_limit: 512
    tmpfs: ["/tmp:rw,nosuid,nodev,size=128m"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/v1/.well-known/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # --- app-cluster profile: on by default (--without-app-cluster opts out) -
  # The community marketplace runtime. Dials OUT to the hub over the
  # dial-out tunnel (phase 3/4) — opens no local listener, so it needs no
  # port mapping and no HOST/PORT/JWT_SECRET. DOCKER_NETWORK/APP_NETWORK_NAME
  # are intentionally left at the image's own defaults, never
  # ${PRIVOS_NETWORK}: runtime containers it deploys join their own private
  # per-runtime network, never this compose stack's network (phase 6) — that
  # is what stops an app container from ever reaching `hub` on this bridge
  # and spoofing it during the bootstrap exchange. Needs Docker socket
  # access — root-equivalent on this host, the same posture the community
  # bundle's earlier Python-driven marketplace runtime had; dockerSocketGid
  # is resolved by install.sh (`stat -c %g /var/run/docker.sock`) into
  # PRIVOS_DOCKER_SOCKET_GID.
  app-cluster:
    image: ghcr.io/privos-ai/privos-app-cluster:${PRIVOS_STACK_VERSION:?PRIVOS_STACK_VERSION is required}@sha256:__APP_CLUSTER_DIGEST__
    container_name: ${PRIVOS_PROJECT:-privos}-app-cluster
    restart: unless-stopped
    profiles: ["app-cluster"]
    networks: [privos]
    # install.sh resolves and validates the real docker-socket gid before
    # ever running compose with the app-cluster profile enabled (same
    # interpolation-before-profile-filtering reasoning as WEAVIATE_ROOT_KEY
    # above).
    group_add: ["${PRIVOS_DOCKER_SOCKET_GID:-0}"]
    environment:
      PRIVOS_HUB_URL: http://hub:3000
      PRIVOS_APP_CLUSTER_BOOTSTRAP_TOKEN: ${PRIVOS_APP_CLUSTER_BOOTSTRAP_TOKEN:?PRIVOS_APP_CLUSTER_BOOTSTRAP_TOKEN is required}
      PRIVOS_STATE_DIR: /var/lib/privos-app-cluster
      CLUSTER_OPERATOR_ROUTES: "off"
      # Node identity keypair (outbound MANAGED-broker attestation signer) —
      # pinned onto the already-persisted state volume below. The image's
      # default path is unwritable by uid 1000 and not on a volume, which
      # would rotate the key on every container recreate.
      MCP_NODE_IDENTITY_KEY_PATH: /var/lib/privos-app-cluster/node-identity.json
      # Origin locally executed apps call for Hub API requests. Must be the
      # hub's public ROOT_URL: workload DPoP proofs are checked against it, and
      # it must be reachable from app containers (not localhost).
      PRIVOS_HUB_PUBLIC_URL: ${PRIVOS_ROOT_URL:?PRIVOS_ROOT_URL is required}
    volumes:
      - ${PRIVOS_DIR}/data/app-cluster-state:/var/lib/privos-app-cluster
      # MANAGED-broker root (McpBrokerManager) — identical path host↔container
      # (prepare() chmods the root; a mismatched path breaks that). /run is
      # tmpfs, so install.sh recreates this dir via tmpfiles.d on every boot.
      - /run/privos/mcp-broker:/run/privos/mcp-broker
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: ${PRIVOS_APP_CLUSTER_MEM:-256m}
    cpus: ${PRIVOS_APP_CLUSTER_CPUS:-1}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      # No TCP listener in tunnel mode (src/server.ts: isTunnelMode() skips
      # fastify.listen()) — the image's own baked-in HEALTHCHECK targets the
      # HTTP/fleet deployment path and would never pass here. Check process
      # liveness instead.
      test: ["CMD-SHELL", "pgrep -f 'dist/server.js' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
